<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML à Toa</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
    }

    p {
      margin-top: 10px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #2a5298;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: #f0f0f0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Olá 👋</h1>
    <p>Esse é um HTML totalmente aleatório.</p>
    <button onclick="alert('Você clicou no botão!')">
      Clique aqui para ver o monumento {{ id }}
    </button>
  </div>

</body>
</html>
